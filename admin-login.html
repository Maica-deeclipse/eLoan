<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eLoan | Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0b0f;
      font-family: 'Inter', sans-serif;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #161020;
      border: 1px solid #2a1b3d;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #c77dff;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .form-control {
      background-color: #0f0f14;
      border: 1px solid #2a1b3d;
      color: #fff;
      margin-bottom: 15px;
    }

    .form-control:focus {
      border-color: #6f42c1;
      box-shadow: none;
      background-color: #0f0f14;
      color: #fff;
    }

    .btn-login {
      width: 100%;
      background-color: #6f42c1;
      border: none;
      font-weight: 600;
    }

    .btn-login:hover {
      background-color: #845ef7;
    }

    a {
      color: #ccc;
      text-decoration: none;
    }

    a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="roleTitle">Admin Login</h2>
    <p>Enter your credentials to access the admin portal</p>

    <input type="email" id="email" class="form-control" placeholder="Email" required>
    <input type="password" id="password" class="form-control" placeholder="Password" required>

    <button class="btn btn-login mt-2" onclick="login()">Login</button>

    <p class="mt-3"><a href="admin-role-selection.html">Back to Role Selection</a></p>
 
     <span class="text-muted">Don’t have an account?</span>
        <a href="admin-register.html" class="link-accent">Create Account</a>
</div>



  <script>
    // Get role from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role') || 'admin';

    // Display role in heading
    document.getElementById('roleTitle').innerText = `${role.replace('-', ' ')} Login`;

    function login() {
      // Placeholder login simulation
      alert(`Login successful! Redirecting to ${role.replace('-', ' ')} Dashboard...`);

      let dashboardUrl = '';
      switch(role) {
        case 'bookkeeper':
          dashboardUrl = 'admin-bookkeeper-dashboard.html';
          break;
        case 'treasurer':
          dashboardUrl = 'admin-treasurer-dashboard.html';
          break;
        case 'credit-committee':
          dashboardUrl = 'admin-credit-committee-dashboard.html';
          break;
        default:
          dashboardUrl = 'admin-dashboard.html';
      }

      window.location.href = dashboardUrl;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
