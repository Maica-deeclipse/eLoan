<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eLoan | Admin Registration</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0b0f;
      color: #eaeaea;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #161020;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      border: 1px solid #2a1b3d;
      text-align: center;
    }

    h2 {
      color: #c77dff;
      margin-bottom: 20px;
    }

    .form-control {
      background-color: #0f0f14;
      border: 1px solid #2a1b3d;
      color: #fff;
      margin-bottom: 15px;
    }

    .form-control:focus {
      border-color: #6f42c1;
      box-shadow: none;
      background-color: #0f0f14;
      color: #fff;
    }

    .btn-register {
      width: 100%;
      background-color: #6f42c1;
      border: none;
      font-weight: 600;
    }

    .btn-register:hover {
      background-color: #845ef7;
    }

    a {
      color: #ccc;
      text-decoration: none;
    }

    a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Admin Registration</h2>
    <p>Create a new admin account for eLoan</p>

    <input type="text" class="form-control" placeholder="Full Name" required>
    <input type="email" class="form-control" placeholder="Email Address" required>
    <select class="form-select form-control">
      <option>Select Role</option>
      <option>Bookkeeper</option>
      <option>Treasurer</option>
      <option>Credit Committee</option>
    </select>
    <input type="password" class="form-control" placeholder="Password" required>
    <input type="password" class="form-control" placeholder="Confirm Password" required>

    <button class="btn btn-register mt-3" onclick="register()">Create Account</button>

    <p class="mt-3">Already have an account? <a href="admin-role-selection.html">Login here</a></p>
  </div>

  <script>
    function register() {
      // Placeholder for actual registration logic
      alert("Admin account created successfully! Redirecting to role selection...");
      window.location.href = "admin-role-selection.html";
    }
  </script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
