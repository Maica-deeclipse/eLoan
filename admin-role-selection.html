<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eLoan | Admin Role Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0b0f;
      font-family: 'Inter', sans-serif;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: #161020;
      border: 1px solid #2a1b3d;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h2 {
      color: #c77dff;
      margin-bottom: 20px;
    }

    .btn-role {
      width: 100%;
      margin-bottom: 15px;
      background-color: #6f42c1;
      border: none;
      color: #fff;
      font-weight: 600;
    }

    .btn-role:hover {
      background-color: #845ef7;
    }

    p {
      color: #ccc;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Admin Portal</h2>
    <p>Select your role to continue</p>

    <button class="btn btn-role" onclick="goToLogin('bookkeeper')">Bookkeeper</button>
    <button class="btn btn-role" onclick="goToLogin('treasurer')">Treasurer</button>
    <button class="btn btn-role" onclick="goToLogin('credit-committee')">Credit Committee</button>
     <a href="index.html" class="back-link">← Back to Welcome Page</a>
  </div>



  <script>
    function goToLogin(role) {
      // Navigate to the login page based on role
      // Replace with actual login URLs if different
      window.location.href = `admin-login.html?role=${role}`;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
