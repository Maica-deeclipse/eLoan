<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eLoan | Admin Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="theme.css">
  <style>body{font-family:'Inter',sans-serif;margin:0}.sidebar{width:260px;position:fixed;padding:25px}.content{margin-left:280px;padding:30px}.card{border-radius:14px}</style>
</head>
<body class="light-mode">

<div class="sidebar">
  <h4>eLoan | Admin</h4>
  <a href="admin-dashboard.html">Dashboard</a>
  <a href="admin-applications.html">Applications</a>
  <a href="admin-profile.html">Profile</a>
  <a class="active" href="admin-settings.html">Settings</a>
  <a href="admin-logout.html">Logout</a>
</div>

<div class="content">
  <h2>Settings</h2>
  <p class="text-muted">Manage preferences</p>
  <div class="card p-4">
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="darkModeSwitch" data-theme-toggle>
      <label class="form-check-label" for="darkModeSwitch">Light Mode</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="notifications" checked>
      <label class="form-check-label" for="notifications">Enable Notifications</label>
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
  </div>
</div>

<script>
  function saveSettings(){ alert('Settings saved!'); }
</script>

<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
