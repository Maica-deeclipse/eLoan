<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eLoan | Employee Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Theme Styles -->
  <link rel="stylesheet" href="theme.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .login-container {
      min-height: 100vh;
    }

    .card {
      border-radius: 16px;
      padding: 30px;
    }
  </style>
</head>

<body>

<div class="container login-container d-flex align-items-center justify-content-center">
  <div class="col-md-5 col-lg-4">

    <div class="card">
      <h3 class="card-title text-center mb-2">Employee Login</h3>
      <p class="text-center text-muted mb-4">
        Access your eLoan account
      </p>

      <form>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="employee@email.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Remember me
            </label>
          </div>
          <a href="#" class="link-accent">Forgot password?</a>
        </div>

        <!-- Later this will redirect to employee dashboard -->
        <a href="employee-dashboard.html" button type="submit" class="btn btn-primary w-100 mb-3">
          Login
          </a>
        </button>
      </form>

      <div class="text-center">
        <span class="text-muted">Don’t have an account?</span>
        <a href="employee-register.html" class="link-accent">Create Account</a>
      </div>

      <div class="text-center mt-4">
        <a href="index.html" class="back-link">← Back to Welcome Page</a>
      </div>
    </div>

  </div>
</div>

<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
