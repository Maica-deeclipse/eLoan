<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eLoan | Logout</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Theme Styles -->
  <link rel="stylesheet" href="theme.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .logout-card {
      padding: 40px;
      border-radius: 16px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 30px;
    }

    .btn-logout {
      background-color: #ff6b6b;
      border: none;
      color: #fff;
      margin-right: 10px;
    }

    .btn-logout:hover {
      background-color: #ff8787;
    }

    .btn-cancel {
      background-color: #6f42c1;
      border: none;
      color: #fff;
    }

    .btn-cancel:hover {
      background-color: #845ef7;
    }
  </style>
</head>
<body class="light-mode">

  <div class="logout-card">
    <h2>Confirm Logout</h2>
    <p>Are you sure you want to logout?</p>
    <button class="btn btn-logout" onclick="logoutUser()">Yes, Logout</button>
    <button class="btn btn-cancel" onclick="cancelLogout()">No, Cancel</button>
  </div>

  <script>
    function logoutUser() {
      // Redirect to employee login page
      window.location.href = "employee-login.html";
    }

    function cancelLogout() {
      // Go back to previous page/dashboard
      window.history.back();
    }
  </script>

  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
