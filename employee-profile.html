<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eLoan | Employee Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Theme Styles -->
  <link rel="stylesheet" href="theme.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      position: fixed;
      padding: 25px;
    }

    .sidebar h4 {
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      text-decoration: none;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #6f42c1;
      color: #fff;
    }

    .content {
      margin-left: 280px;
      padding: 30px;
    }

    /* Form and Card styles handled by theme.css */
  </style>
</head>

<body class="light-mode">

<!-- SIDEBAR -->
<div class="sidebar">
  <h4>eLoan</h4>
  <a href="employee-dashboard.html">Dashboard</a>
  <a href="employee-recent-applications.html">Recent Applications</a>
  <a href="employee-add-loan.html">Add New Loan</a>
  <a href="employee-track-status.html">Track Status</a>
  <a href="employee-profile.html" class="active">Profile</a>
  <a href="employee-settings.html">Settings</a>
  <a href="employee-logout.html">Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="mb-4">
    <h2>My Profile</h2>
    <p class="text-muted">View and edit your personal and employment information</p>
  </div>

  <div class="card p-4 mb-4">
    <h5>Personal Information</h5>
    <div class="row g-3 mt-2">
      <div class="col-md-6"><input class="form-control" placeholder="Full Name" value="Juan Dela Cruz"></div>
      <div class="col-md-6"><input class="form-control" placeholder="Email" value="juan@email.com"></div>
      <div class="col-md-4"><input type="date" class="form-control" value="1990-01-01"></div>
      <div class="col-md-2"><input class="form-control" placeholder="Age" value="36"></div>
      <div class="col-md-3">
        <select class="form-select">
          <option>Single</option>
          <option selected>Married</option>
          <option>Widowed</option>
        </select>
      </div>
      <div class="col-md-3"><input class="form-control" placeholder="Contact Number" value="09171234567"></div>
      <div class="col-md-12"><input class="form-control" placeholder="Complete Address" value="123 Main Street, Malaybalay City, Philippines"></div>
      <div class="col-md-6"><input class="form-control" placeholder="TIN" value="123-456-789"></div>
    </div>
  </div>

  <div class="card p-4 mb-4">
    <h5>Employment Information</h5>
    <div class="row g-3 mt-2">
      <div class="col-md-4"><input class="form-control" placeholder="Office / Department" value="Finance Department"></div>
      <div class="col-md-4"><input class="form-control" placeholder="Position" value="Staff"></div>
      <div class="col-md-4"><input class="form-control" placeholder="Employment Status" value="Permanent"></div>
      <div class="col-md-4"><input class="form-control" placeholder="Net Take-Home Pay (Php)" value="25,000"></div>
    </div>
  </div>

  <button class="btn btn-primary">Save Changes</button>

</div>

<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
