<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>eLoan | Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Theme Styles -->
  <link rel="stylesheet" href="theme.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Sidebar styles handled by theme.css */
    .sidebar {
      width: 260px;
      min-height: 100vh;
      position: fixed;
      padding: 25px;
    }

    .sidebar h4 {
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      text-decoration: none;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background-color: #6f42c1;
      color: #fff;
    }

    /* Content */
    .content {
      margin-left: 280px;
      padding: 30px;
      transition: color 0.3s;
    }

    /* Cards */
    .card {
      padding: 30px;
      margin-bottom: 30px;
      color: #111;
    }

    .form-check-input:checked {
      background-color: #6f42c1;
      border-color: #6f42c1;
    }

    .form-control, .form-select {
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }
    /* Form controls handled by theme.css */

    .btn-primary {
      background-color: #6f42c1;
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #845ef7;
    }

    h5 {
      color: #c77dff;
      font-weight: 600;
    }

  </style>
</head>

<body class="light-mode">

<!-- SIDEBAR -->
<div class="sidebar">
  <h4>eLoan</h4>
  <a href="employee-dashboard.html">Dashboard</a>
  <a href="employee-recent-applications.html">Recent Applications</a>
  <a href="employee-add-loan.html">Add New Loan</a>
  <a href="employee-track-status.html">Track Status</a>
  <a href="employee-profile.html">Profile</a>
  <a href="employee-settings.html" class="active">Settings</a>
  <a href="employee-logout.html">Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="content">

  <div class="mb-4">
    <h2>Settings</h2>
    <p class="text-muted">Customize your preferences for security, privacy, and notifications</p>
  </div>

  <!-- DARK MODE -->
  <div class="card p-4 mb-4">
    <h5>Appearance</h5>
    <div class="form-check form-switch mt-2">
      <input class="form-check-input" type="checkbox" id="darkModeSwitch" data-theme-toggle>
      <label class="form-check-label" for="darkModeSwitch">Light Mode</label>
    </div>
  </div>

  <!-- SECURITY & PRIVACY -->
  <div class="card p-4 mb-4">
    <h5>Security & Privacy</h5>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="twoFactor">
      <label class="form-check-label" for="twoFactor">Enable Two-Factor Authentication</label>
    </div>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="dataSharing">
      <label class="form-check-label" for="dataSharing">Allow data sharing for analytics</label>
    </div>
    <div class="mt-3">
      <label class="form-label">Change Password</label>
      <input type="password" class="form-control mb-2" placeholder="Current Password">
      <input type="password" class="form-control mb-2" placeholder="New Password">
      <input type="password" class="form-control mb-2" placeholder="Confirm New Password">
      <button class="btn btn-primary mt-2">Update Password</button>
    </div>
  </div>

  <!-- NOTIFICATIONS -->
  <div class="card p-4 mb-4">
    <h5>Notifications</h5>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="loanStatusNotif" checked>
      <label class="form-check-label" for="loanStatusNotif">Notify me about loan status updates</label>
    </div>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="promoNotif">
      <label class="form-check-label" for="promoNotif">Receive promotional offers</label>
    </div>
  </div>

</div>

<!-- Theme Management -->
<script src="theme.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
